<!DOCTYPE html>
<!-- Tells the browser that this is an HTML5 document -->

<html lang="en">
<!-- Starts the HTML document and declares English as the language -->

<head>
    <!-- Contains information about the page -->

    <meta charset="UTF-8">
    <!-- Allows the browser to correctly display characters -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Makes the page responsive on different screen sizes -->

    <title>Demo App</title>
    <!-- Sets the browser tab title -->

    <link rel="stylesheet" href="style.css">
    <!-- Connects this HTML file to style.css -->

</head>

<body>
    <!-- Contains everything visible on the page -->

    <div class="container">
        <!-- Main container for the landing page -->

        <h1>Welcome to Demo App</h1>
        <!-- Main heading -->

        <p>Learn Registration, Login and Authentication</p>
        <!-- Short description -->

        <div class="buttons">
            <!-- Container for the two buttons -->

            <a href="register/register.html">Register</a>
            <!-- Opens the registration page -->

            <a href="login/login.html">Login</a>
            <!-- Opens the login page -->

        </div>

    </div>

</body>

</html>
